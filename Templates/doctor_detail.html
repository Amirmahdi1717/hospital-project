{% load static %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ doctor.name }}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<nav>

    <h2>🏥 بیمارستان سلامت</h2>

    <a href="{% url 'home' %}">
        صفحه اصلی
    </a>

</nav>


<div class="appointment-box">

    <h1>👨‍⚕️ {{ doctor.name }}</h1>

    <hr>

    <h3>🩺 تخصص</h3>

    <p>
        {{ doctor.specialty }}
    </p>


    <h3>📞 شماره تماس</h3>

    <p>
        {{ doctor.phone }}
    </p>


    <br>

    <a
        class="button"
        href="{% url 'appointment' %}"
    >
        📅 دریافت نوبت
    </a>

</div>

</body>

</html>
